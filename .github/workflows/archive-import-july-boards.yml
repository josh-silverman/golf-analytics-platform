name: One-off import of the surviving July boards

# TEMPORARY — imports the two July live captures (The Open tid 100, Rocket
# Classic tid 524) that survived the Key Value wipe only as local file
# snapshots on Josh's machine. They are the sole primary evidence from the
# pre-wipe forward record (everything else must be reconstructed as
# "backfilled"), so they go in first and separately. The document was
# committed to the private ledger as golf-analytics/recovered-july-boards.json.
#
# Manual dispatch only. Delete after the import is confirmed — same policy
# as the restore drill: writes into the production archives stay deliberate,
# human-triggered acts.

on:
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the recovered boards from the private ledger
        env:
          LEDGER_DEPLOY_KEY: ${{ secrets.LEDGER_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LEDGER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:josh-silverman/pinpoint-ledger.git ledger

      - name: POST /analytics/archive/import
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "X-Admin-Token: ${{ secrets.ADMIN_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data @ledger/golf-analytics/recovered-july-boards.json \
            https://pga-analytics-api.onrender.com/api/v1/analytics/archive/import \
            | tee import-result.json
          echo
          echo "--- import result ---"
          cat import-result.json
